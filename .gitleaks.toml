title = "Ops Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "smtp-credential"
description = "SMTP or Gmail password and token assignments"
regex = '''(?i)(?:smtp|gmail)[_.-]?(?:password|pass|pwd|secret|key|token)\s*[:=]\s*["']?([^\s"']{8,})'''
secretGroup = 1
keywords = ["smtp", "gmail"]
