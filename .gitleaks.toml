title = "Ops Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "microsoft-graph-credential"
description = "Microsoft Graph application credential assignments"
regex = '''(?i)(?:graph|microsoft)[_.-]?(?:client[_.-]?secret|password|pass|pwd|secret|key|token)\s*[:=]\s*["']?([^\s"']{8,})'''
secretGroup = 1
keywords = ["graph", "microsoft"]
