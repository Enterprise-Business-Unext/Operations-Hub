services:
  db:
    image: postgres:16-alpine
    container_name: ops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ops_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ops_db}
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ops_network

  redis:
    image: redis:7-alpine
    container_name: ops_redis
    restart: unless-stopped
    command: >-
      sh -c 'exec redis-server --appendonly yes
      $${REDIS_PASSWORD:+--requirepass "$${REDIS_PASSWORD}"}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli $${REDIS_PASSWORD:+-a "$${REDIS_PASSWORD}"} ping | grep PONG
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ops_network

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: ops_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set a unique random SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ops_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-[]}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SENDER_EMAIL: ${GRAPH_SENDER_EMAIL:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Enterprise Ops Platform}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ops_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: ops_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net'); const s=net.connect(3000,'127.0.0.1'); s.on('connect',()=>{s.destroy();process.exit(0)}); s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ops_network

  nginx:
    image: nginx:1.27-alpine
    container_name: ops_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - ops_network

  # Development frontend with hot reload (Fast Refresh).
  #
  # The `frontend` service above serves a pre-built standalone bundle and mounts
  # no source, so it cannot hot reload: there is no compiler, no file watcher,
  # and no HMR socket, and host edits are invisible until the image is rebuilt.
  # This service runs `next dev` with the working tree bind-mounted instead.
  #
  # It sits behind the `dev` profile so the default `docker compose up` stack
  # is unchanged. It binds the same host port as `frontend`, so stop that
  # service first or set FRONTEND_DEV_PORT to a different value.
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Containerfile.dev
    container_name: ops_frontend_dev
    restart: unless-stopped
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_DEV_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${FRONTEND_DEV_API_URL:-http://localhost:8000/api/v1}
      # Docker Desktop's bind-mount layer does not deliver inotify-style
      # filesystem events into the container, so webpack's watcher needs to poll
      # to observe host edits. Without this, edits are saved but the page never
      # updates. Next watches through watchpack (not chokidar), so this is the
      # only knob that matters. Set FRONTEND_WATCH_POLLING=false for cheaper
      # watching on Linux hosts or when running the dev server natively.
      - WATCHPACK_POLLING=${FRONTEND_WATCH_POLLING:-true}
    volumes:
      - ./frontend:/app
      # The host tree is Windows and carries win32-native binaries, so it must
      # not shadow the container's Linux dependencies.
      - frontend_dev_node_modules:/app/node_modules
      # Keep compiled output on the container filesystem. Writing .next through
      # the Docker Desktop mount is dramatically slower.
      - frontend_dev_next:/app/.next
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net'); const s=net.connect(3000,'127.0.0.1'); s.on('connect',()=>{s.destroy();process.exit(0)}); s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - ops_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  frontend_dev_node_modules:
    driver: local
  frontend_dev_next:
    driver: local

networks:
  ops_network:
    driver: bridge