name: Build and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.image-names.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve lowercase GHCR image prefix
        id: image-names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Containerfile
          push: true
          tags: ${{ steps.image-names.outputs.prefix }}-backend:sha-${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Containerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          tags: ${{ steps.image-names.outputs.prefix }}-frontend:sha-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned EC2 SSH host key
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      - name: Copy production configuration to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          target="$EC2_USER@$EC2_HOST"
          ssh "$target" 'mkdir -p /opt/operations-hub/nginx'
          scp docker-compose.production.yml "$target:/opt/operations-hub/docker-compose.production.yml"
          scp nginx/production.conf.template "$target:/opt/operations-hub/nginx/production.conf.template"
      - name: Pull and restart release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "cd /opt/operations-hub && export IMAGE_TAG='$IMAGE_TAG' && docker compose -f docker-compose.production.yml pull && docker compose -f docker-compose.production.yml up -d --remove-orphans && docker compose -f docker-compose.production.yml ps"
      - name: Verify public health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --show-error --retry 10 --retry-all-errors --retry-delay 5 "$APP_URL/health"
